name: Desktop source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux source checks
        if: runner.os == 'Linux'
        run: ./gradlew test
      - name: Windows checks
        if: runner.os == 'Windows'
        run: .\gradlew.bat test
      - name: Restore pinned Windows inference runtimes
        if: runner.os == 'Windows'
        id: engines
        uses: actions/cache/restore@v5
        with:
          path: build/package-resources/windows/native
          key: windows-x64-engines-${{ hashFiles('scripts/build_native_windows.ps1') }}
      - name: Build verified Windows inference runtimes
        if: runner.os == 'Windows' && steps.engines.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build_native_windows.ps1
      - name: Cache built Windows inference runtimes
        if: runner.os == 'Windows' && steps.engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/package-resources/windows/native
          key: ${{ steps.engines.outputs.cache-primary-key }}
      - name: Build and test Windows shortcut and credential helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S packaging/windows-helper -B build/windows-helper
          if ($LASTEXITCODE) { throw "Could not configure helper" }
          cmake --build build/windows-helper --config Release
          if ($LASTEXITCODE) { throw "Could not build helper" }
          $helper = "build/windows-helper/Release/alter-windows.exe"
          $fixture = "alter-test-key"
          $fixture | & $helper save 9999
          if ($LASTEXITCODE -or ((& $helper load 9999).Trim() -ne $fixture)) { throw "Credential round-trip failed" }
          & $helper forget 9999
          if ($LASTEXITCODE) { throw "Could not remove test credential" }
          ./scripts/test_window_controls.ps1 -Helper $helper
          Copy-Item $helper build/package-resources/windows/native/
      - name: Package and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat createDistributable packageMsi *> installer-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content installer-build.log -Tail 45) -join '%0A'
            Write-Host "::error title=MSI packaging failed::$tail"
            throw "MSI packaging failed"
          }
          Get-Content installer-build.log -Tail 15
          try { .\scripts\verify_windows_installer.ps1 }
          catch {
            Write-Host "::error title=MSI verification failed::$($_.Exception.Message)"
            throw
          }
      - name: Open the packaged Plugins screen on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Resolve-Path "build/compose/binaries/main/app/Alter/Alter.exe").Path
          $process = Start-Process -FilePath $app -ArgumentList '--preview=plugins','--screenshot' -WorkingDirectory $pwd -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw "The packaged app did not finish the screen capture"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path build/screenshots/plugins.png)) {
            throw "The packaged app did not render Plugins"
          }
      - name: Upload Windows screen preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Alter-Windows-Screen
          path: build/screenshots/plugins.png
          if-no-files-found: error
      - name: Cache verified Qwen test weights
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/alter-test-models
          key: alter-qwen-small-9465e63a
      - name: Exercise packaged CPU engine with real local chat
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ALTER_CHECK_PACKAGED_CHAT = "1"
          $env:ALTER_TEST_MODEL_CACHE = Join-Path $env:RUNNER_TEMP "alter-test-models"
          $env:ALTER_NATIVE_DIR = (Resolve-Path "build/compose/binaries/main/app/Alter/app/resources/native").Path
          .\gradlew.bat test --tests alter.PackagedChatTest
          if ($LASTEXITCODE -ne 0) {
            $report = [xml](Get-Content "build/test-results/test/TEST-alter.PackagedChatTest.xml" -Raw)
            throw $report.testsuite.testcase.failure.message
          }
      - name: Upload packaged model measurement
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Alter-Windows-Model-Benchmark
          path: build/reports/packaged-model-benchmark.json
          if-no-files-found: error
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Alter-Windows-Installer
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - name: Upload runnable Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Alter-Windows
          path: build/compose/binaries/main/app/Alter/
          if-no-files-found: error
