name: Desktop source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify official fonts
        run: python scripts/setup_fonts.py
      - name: Linux source checks
        if: runner.os == 'Linux'
        run: ./gradlew test
      - name: Windows checks and native application image
        if: runner.os == 'Windows'
        run: .\gradlew.bat test createDistributable
      - name: Build verified Windows inference runtimes
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_native_windows.ps1
      - name: Package and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat packageMsi
          if ($LASTEXITCODE -ne 0) { throw "MSI packaging failed" }
          .\scripts\verify_windows_installer.ps1
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Alter-Windows-Installer
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - name: Upload runnable Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Alter-Windows
          path: build/compose/binaries/main/app/Alter/
          if-no-files-found: error
