name: Desktop source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify official fonts
        run: python scripts/setup_fonts.py
      - name: Linux source checks
        if: runner.os == 'Linux'
        run: ./gradlew test
      - name: Windows checks and native application image
        if: runner.os == 'Windows'
        run: .\gradlew.bat test createDistributable
