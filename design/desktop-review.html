<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alter for Windows · Screen review</title>
<style>
  :root { color-scheme: dark; font: 15px/1.45 "Segoe UI",sans-serif; background:#000; color:#ececec }
  body { margin:0 auto; max-width:1440px; padding:20px }
  header { display:flex; align-items:center; gap:14px; margin-bottom:16px }
  h1 { font-size:18px; margin:0 }
  select { background:#191919; color:inherit; border:1px solid #262626; padding:8px 12px; border-radius:7px }
  img { display:block; width:100%; height:auto; border:1px solid #262626; border-radius:10px; box-sizing:border-box }
  a { margin-left:auto; color:#ffbd00 } label { color:#a1a1aa }
  @media(max-width:620px){ body{padding:8px} header{flex-wrap:wrap;gap:8px} h1{width:100%} }
</style>
</head>
<body>
<header><h1>Alter for Windows</h1><label for="screen">Screen</label>
<select id="screen">
<option value="chat">Alter AI</option><option value="home">Home</option><option value="memories">Memories</option>
<option value="upcoming">Upcoming</option><option value="notes">Notes</option><option value="capture">Capture menu</option>
<option value="settings">Appearance</option><option value="models">AI models</option><option value="voice">Voice &amp; files</option>
<option value="backup">Backup &amp; account</option><option value="about">About</option>
</select><a id="full" href="previews/chat.png">Full size</a></header>
<img id="preview" src="previews/chat.png" width="1280" height="800" alt="Alter AI dashboard with saved chat groups and a local text composer">
<script>
  const screenPicker = document.querySelector('#screen');
  const preview = document.querySelector('#preview');
  const full = document.querySelector('#full');
  function showScreen() {
    const requested = location.hash.slice(1);
    screenPicker.value = Array.from(screenPicker.options).some(option => option.value === requested) ? requested : 'chat';
    const path = 'previews/' + screenPicker.value + '.png';
    preview.src = full.href = path;
    preview.alt = screenPicker.selectedOptions[0].text + ' screen in the native Alter desktop application';
  }
  screenPicker.addEventListener('change', () => { location.hash = screenPicker.value; });
  window.addEventListener('hashchange', showScreen);
  showScreen();
</script>
</body>
</html>
